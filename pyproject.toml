[project]
name = "flame"
version = "1.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pavadol Yamsiri", email = "pavyamsiri@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3.4",
    "optype[numpy]>=0.14.0",
    "polars>=1.35.1",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.pyrefly.errors]
implicit-any-parameter = "error"
deprecated = "error"
implicit-any = "ignore"
bad-argument-type = "ignore"

[tool.pyright]
exclude = [".venv"]
venvPath = "."
venv = ".venv"

pythonVersion = "3.13"
typeCheckingMode = "strict"
deprecateTypingAliases = true
reportDeprecated = true
reportMissingParameterType = true
reportMissingTypeArgument = true
reportUnknownParameterType = true

reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportArgumentType = false

[tool.mypy]
allow_any_expr = true
allow_any_explicit = true
warn_return_any = false

[tool.ruff]
line-length = 130

[tool.ruff.lint]
extend-select = ["D", "D413", "I", "RUF", "TC"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.pyrefly]
project-excludes = [".venv"]
python-version = "3.13.0"
infer-with-first-use = false

[dependency-groups]
dev = [
    "astropy>=8.0.2",
    "basedmypy>=2.10.0",
    "basedpyright>=1.39.10",
    "galpy>=1.11.1",
    "hypothesis[numpy]>=6.145.1",
    "pyrefly>=1.2.0",
    "pytest>=8.4.2",
    "ty>=0.0.77",
]
